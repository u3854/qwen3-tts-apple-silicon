<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Qwen3-TTS Studio</title>
  <meta name="description" content="Local-network web UI for Qwen3-TTS — generate, design, and clone voices with Apple Silicon." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <!-- Background orbs -->
  <div class="bg-orbs" aria-hidden="true">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <div class="app-shell">
    <!-- ── Sidebar ─────────────────────────────────────────────── -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-logo">
        <span class="logo-icon">🎙</span>
        <div>
          <div class="logo-title">Qwen3-TTS</div>
          <div class="logo-sub">Studio</div>
        </div>
      </div>

      <nav class="model-nav" id="model-nav" aria-label="Model selection">
        <!-- Populated by app.js from /api/config -->
        <div class="nav-skeleton"></div>
      </nav>

      <div class="sidebar-footer">
        <button class="btn btn-secondary" style="width:100%; justify-content:center; margin-bottom:12px;" id="history-toggle-btn">📂 View Outputs</button>
        <div style="display:flex; align-items:center; gap:8px;">
          <div class="status-dot" id="status-dot" title="Server status"></div>
          <span id="status-label">Connecting…</span>
        </div>
      </div>
    </aside>

    <!-- ── Main content ────────────────────────────────────────── -->
    <main class="main-content">
      <!-- Header -->
      <header class="topbar">
        <button class="sidebar-toggle" id="sidebar-toggle" aria-label="Toggle sidebar">
          <span></span><span></span><span></span>
        </button>
        <div class="topbar-title" id="topbar-title">Select a model</div>
        <div class="topbar-badge" id="topbar-badge"></div>
      </header>

      <!-- Panel grid -->
      <div class="panel-grid">

        <!-- ── Controls panel ──────────────────────────────── -->
        <section class="panel panel-controls" aria-label="Generation controls">
          <div class="panel-header">
            <h2 class="panel-title">Controls</h2>
            <div class="mode-tabs" id="mode-tabs" role="tablist"></div>
          </div>
          <div class="panel-body" id="controls-body">
            <div class="empty-state">
              <div class="empty-icon">⚡</div>
              <p>Choose a model from the sidebar to get started.</p>
            </div>
          </div>
        </section>

        <!-- ── Output panel ────────────────────────────────── -->
        <section class="panel panel-output" aria-label="Generation output">
          <div class="panel-header">
            <h2 class="panel-title">Output</h2>
            <button class="btn-icon" id="clear-log-btn" title="Clear log" aria-label="Clear log">✕</button>
          </div>

          <!-- Audio player -->
          <div class="audio-card" id="audio-card" hidden>
            <div class="audio-waveform" id="audio-waveform" aria-hidden="true">
              <div class="wave-bars">
                <span></span><span></span><span></span><span></span><span></span>
                <span></span><span></span><span></span><span></span><span></span>
              </div>
            </div>
            <div class="audio-info">
              <span class="audio-filename" id="audio-filename">—</span>
              <a class="audio-download" id="audio-download" download title="Download">⬇</a>
            </div>
            <audio id="audio-player" controls></audio>
          </div>

          <!-- Progress log -->
          <div class="log-scroll" id="log-scroll" role="log" aria-live="polite" aria-label="Generation log">
            <div class="log-empty">No output yet.</div>
          </div>
        </section>

      </div><!-- /panel-grid -->
    </main>
  </div>

  <!-- ── Voice Library Drawer (clone mode) ───────────────────── -->
  <div class="drawer-backdrop" id="drawer-backdrop" hidden></div>
  <div class="drawer" id="voice-drawer" role="dialog" aria-modal="true" aria-label="Voice library" hidden>
    <div class="drawer-header">
      <h3>Voice Library</h3>
      <button class="btn-icon" id="close-drawer-btn" aria-label="Close">✕</button>
    </div>
    <div class="drawer-body" id="voice-library-body">
      <!-- Populated dynamically -->
    </div>
    <div class="drawer-footer">
      <button class="btn btn-secondary" id="enroll-toggle-btn">+ Enroll New Voice</button>
    </div>
    <!-- Enroll form (hidden by default) -->
    <div class="enroll-form" id="enroll-form" hidden>
      <h4>Enroll New Voice</h4>
      <label>Voice name
        <input type="text" id="enroll-name" placeholder="e.g. Boss, Mom" />
      </label>
      <label>Reference audio
        <div class="file-drop" id="enroll-drop" tabindex="0" role="button" aria-label="Drop audio file here">
          <span id="enroll-drop-label">Drag &amp; drop or click to browse</span>
          <input type="file" id="enroll-file" accept="audio/*" hidden />
        </div>
      </label>
      <label>Transcript <span class="hint">(type exactly what the audio says)</span>
        <textarea id="enroll-transcript" rows="3" placeholder="Exact words spoken in the audio…"></textarea>
      </label>
      <button class="btn btn-primary" id="enroll-submit-btn">Save Voice</button>
      <div class="enroll-status" id="enroll-status"></div>
    </div>
  </div>

  <!-- ── Output History Drawer ─────────────────────────────────── -->
  <div class="drawer" id="history-drawer" role="dialog" aria-modal="true" aria-label="Output history" hidden>
    <div class="drawer-header">
      <h3>Output History</h3>
      <button class="btn-icon" id="close-history-btn" aria-label="Close">✕</button>
    </div>
    <div class="drawer-body" id="history-body">
      <!-- Populated dynamically -->
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
